<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Internal CSS Example</title>
    <!-- Your internal CSS goes inside the <style> tags below -->
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333333;
            text-align: center;
        }
        .highlight-text {
            color: #ff5722;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>This is a normal paragraph following the body font rules.</p>
    <p class="highlight-text">This paragraph has a specific class applied to it.</p>

</body>
</html>
